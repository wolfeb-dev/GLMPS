<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="setup.css">
<title>GLMPS 2.0 setup</title>
</head>
<body>
<a class="skip" href="#panel">Skip to step content</a>
<div class="wizard">
  <nav class="rail" aria-label="Setup steps">
    <div class="brand">
      <svg class="mark" viewBox="0 0 200 200" width="36" height="36" aria-hidden="true">
        <circle cx="100" cy="100" r="94" fill="#0a0b0d"/>
        <circle cx="100" cy="100" r="78" fill="none" stroke="#afdde5" stroke-width="4" opacity="0.4"/>
        <path d="M 146 126 A 50 50 0 1 1 146 74" fill="none" stroke="#964734" stroke-width="18" stroke-linecap="round"/>
        <path d="M 146 100 H 112" fill="none" stroke="#964734" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
      </svg>
      <div>
        <p class="brand-name">GLMPS 2.0</p>
        <p class="brand-sub">Setup</p>
      </div>
    </div>
    <ol id="rail-list" class="rail-list"></ol>
  </nav>
  <div class="main">
    <main id="panel" class="panel" tabindex="-1">
      <div id="panel-inner" class="panel-inner"></div>
    </main>
    <footer class="foot">
      <div id="progress" class="progress" role="progressbar" aria-label="Setup is working" hidden><span class="bar"></span></div>
      <div id="foot-left" class="foot-group"></div>
      <div class="foot-mid">
        <p id="foot-status" class="foot-status" role="status"></p>
        <p id="foot-hint" class="foot-hint"></p>
      </div>
      <div id="foot-right" class="foot-group"></div>
    </footer>
  </div>
</div>
<script src="setup.js"></script>
</body>
</html>
