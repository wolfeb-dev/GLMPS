    <tspan fill="#0fa4af">Watch your agents.</tspan><tspan fill="#afdde5" fill-opacity="0.7"> Catch the misses.</tspan>
  </text>

  <text x="730" y="34" text-anchor="end"
        font-family="'Fira Code', 'JetBrains Mono', ui-monospace, monospace"
        font-size="11" letter-spacing="2" fill="#0fa4af" fill-opacity="0.6">SYS_MONITOR // ACTIVE</text>
